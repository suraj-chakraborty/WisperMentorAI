name: CI Pipeline

on:
  push:
    branches: [main, master, 'chore/**', 'fix/**', 'feat/**']
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (NestJS & Prisma)
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-jwt-secret-must-be-at-least-32-chars-long
      AES_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/whispermentor_test
      INTERNAL_AI_TOKEN: ci-internal-ai-service-token-secret
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=apps/backend/prisma/schema.prisma

      - name: Build Shared Package
        run: npm run build --workspace=packages/shared

      - name: Build Backend
        run: npm run build --workspace=apps/backend

      - name: Run Backend Tests
        run: npm test --workspace=apps/backend

  desktop:
    name: Desktop (Electron & Vite & React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build --workspace=packages/shared

      - name: Typecheck Desktop
        run: npm run typecheck --workspace=apps/desktop

      - name: Run Desktop Tests
        run: npm test --workspace=apps/desktop

      - name: Build Desktop Bundle
        run: npm run build --workspace=apps/desktop

  ai-service:
    name: AI Service (FastAPI & Whisper)
    runs-on: ubuntu-latest
    env:
      INTERNAL_AI_TOKEN: ci-internal-ai-service-token-secret
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/ai-service/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run AI Service Tests
        run: python -m pytest apps/ai-service
